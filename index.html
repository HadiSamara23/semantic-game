<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>בחר את המילה המתאימה</title>
<meta name="description" content="משחק ידע סמנטי לילדים">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8e7;
    --paper: #ffffff;
    --ink: #1f2a5a;
    --muted: #5b6390;
    --yellow: #ffd43b;
    --yellow-dark: #f2b705;
    --c1: #2e8b3e;
    --c2: #2b8fd6;
    --c3: #8b4fc4;
    --c4: #f08c1a;
    --good: #2fb344;
    --bad: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(#ffe8a3 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 640px; padding: 16px; flex: 1; display: flex; flex-direction: column; }

  /* Header */
  .title {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--yellow);
    border: 4px solid var(--yellow-dark);
    border-radius: 24px;
    padding: 10px 14px;
    box-shadow: 0 6px 0 var(--yellow-dark);
    margin-bottom: 14px;
  }
  .title h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); font-weight: 900; text-align: center; }
  .title .mascot { font-size: clamp(28px, 8vw, 42px); }
  .title .mascot.l { animation: bob 2.4s ease-in-out infinite; }
  .title .mascot.r { animation: bob 2.4s ease-in-out .6s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }

  /* Stars row (self-check) */
  .stars { display: flex; justify-content: center; gap: 10px; margin: 4px 0 14px; }
  .star {
    width: 46px; height: 46px; position: relative;
  }
  .star svg { width: 100%; height: 100%; display: block; }
  .star svg path { fill: #fff; stroke: #c9c9c9; stroke-width: 3; transition: fill .4s, stroke .4s; }
  .star.on svg path { fill: var(--c); stroke: var(--c); }
  .star.on { animation: pop .5s ease; }
  .star.current svg path { stroke: var(--c); stroke-dasharray: 6 4; }
  .star .n {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; padding-top: 4px; color: var(--muted);
  }
  .star.on .n { color: #fff; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* Card */
  .card {
    background: var(--paper);
    border: 4px solid var(--c);
    border-radius: 24px;
    padding: 18px 14px 20px;
    box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 35%, transparent);
    position: relative;
    animation: slideIn .4s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .badge {
    position: absolute; top: -18px; right: 18px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--c); color: #fff; font-weight: 900; font-size: 20px;
    display: grid; place-items: center; border: 3px solid #fff;
  }
  .q { text-align: center; color: var(--c); font-size: clamp(20px, 5.4vw, 26px); font-weight: 800; margin: 6px 0 14px; line-height: 1.3; }
  .hint-pic { text-align: center; font-size: 64px; margin: -4px 0 10px; }
  .hint-pic span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }

  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt {
    font: inherit; color: var(--ink);
    background: #fff; border: 3px solid #e7e7ef; border-radius: 18px;
    padding: 12px 4px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: transform .12s, border-color .2s, background .2s;
  }
  .opt:hover { border-color: var(--c); }
  .opt:active { transform: scale(.95); }
  .opt .pic { font-size: clamp(44px, 13vw, 64px); line-height: 1.1; }
  .opt .word { font-size: clamp(18px, 5vw, 24px); font-weight: 800; }
  .opt .dot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--c); background: #fff; transition: background .2s;
  }
  .opt.right { border-color: var(--good); background: #e9f9ec; }
  .opt.right .dot { background: var(--good); border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: #fdecec; animation: shake .4s; }
  .opt.wrong .dot { background: var(--bad); border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  .feedback { min-height: 56px; text-align: center; margin-top: 14px; font-size: 20px; font-weight: 800; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .feedback small { display: block; font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 2px; }

  .btn {
    font: inherit; font-weight: 800; font-size: 20px;
    background: var(--c, var(--c2)); color: #fff;
    border: none; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--c, var(--c2)) 60%, #000);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c, var(--c2)) 60%, #000); }
  .center { text-align: center; }

  /* Start / end screens */
  .screen { text-align: center; animation: slideIn .4s ease; }
  .big-emoji { font-size: 84px; margin: 10px 0; }
  .big-emoji span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .lead { font-size: 20px; font-weight: 600; margin: 6px 0 22px; line-height: 1.5; }
  details.about {
    margin-top: 26px; text-align: right; background: #fff; border-radius: 16px;
    border: 2px dashed var(--yellow-dark); padding: 10px 16px;
  }
  details.about summary { cursor: pointer; font-weight: 800; color: var(--muted); }
  details.about p { line-height: 1.7; margin: 8px 0; }
  .score { font-size: 24px; font-weight: 800; margin: 4px 0 20px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0 16px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .mute {
    position: fixed; bottom: 12px; left: 12px; z-index: 5;
    background: #fff; border: 2px solid #eee; border-radius: 50%;
    width: 42px; height: 42px; font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="צליל">🔊</button>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="title">
    <span class="mascot l">✏️</span>
    <h1>בחר את המילה המתאימה</h1>
    <span class="mascot r">📘</span>
  </div>
  <div class="stars" id="stars"></div>
  <main id="app"></main>
</div>
<footer>משחק ידע סמנטי · אוצר מילים לילדים</footer>

<script>
const QUESTIONS = [
  {
    color: 'var(--c1)',
    q: 'איזו מילה שייכת למשפחת הפירות?',
    options: [
      { word: 'חולצה', pic: '👕' },
      { word: 'כיסא', pic: '🪑' },
      { word: 'תפוח', pic: '🍎', correct: true },
    ],
    why: 'תפוח הוא פרי! 🍎',
  },
  {
    color: 'var(--c2)',
    q: 'מה ההפך מגדול?',
    options: [
      { word: 'גבוה', pic: '🏔️' },
      { word: 'ארוך', pic: '📏' },
      { word: 'קטן', pic: '🐭', correct: true },
    ],
    why: 'ההפך מגדול הוא קטן!',
  },
  {
    color: 'var(--c3)',
    q: 'איזו מילה אינה שייכת לקבוצה?',
    options: [
      { word: 'בננה', pic: '🍌', correct: true },
      { word: 'חתול', pic: '🐱' },
      { word: 'כלב', pic: '🐶' },
    ],
    why: 'חתול וכלב הם בעלי חיים, ובננה היא פרי!',
  },
  {
    color: 'var(--c4)',
    q: 'איזו מילה מתאימה לתמונה של דבר שאוכלים בבוקר?',
    hint: '🥣🥛',
    options: [
      { word: 'עיפרון', pic: '✏️' },
      { word: 'מיטה', pic: '🛏️' },
      { word: 'ארוחה', pic: '🍽️', correct: true },
    ],
    why: 'בבוקר אוכלים ארוחת בוקר!',
  },
];

const PRAISE = ['כל הכבוד! 🎉', 'מצוין! 🌟', 'אלופים! 🏆', 'יופי! 👏', 'נהדר! 💪'];
const RETRY = ['כמעט! נסו שוב 🙂', 'לא נורא, נסו שוב!', 'חשבו שוב… 🤔'];

const app = document.getElementById('app');
const starsEl = document.getElementById('stars');
let idx = 0, firstTry = 0, triedThis = false, soundOn = true;

const STAR_PATH = 'M50 6 L62 37 L95 38 L69 58 L78 91 L50 72 L22 91 L31 58 L5 38 L38 37 Z';
function renderStars() {
  starsEl.innerHTML = QUESTIONS.map((q, i) =>
    `<div class="star ${i < idx ? 'on' : ''} ${i === idx ? 'current' : ''}" style="--c:${q.color}">
      <svg viewBox="0 0 100 100"><path d="${STAR_PATH}" stroke-linejoin="round"/></svg>
      <div class="n">${i + 1}</div>
    </div>`).join('');
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random() * a.length)];

function startScreen() {
  idx = 0; firstTry = 0;
  starsEl.style.visibility = 'hidden';
  app.innerHTML = `
    <div class="screen">
      <div class="big-emoji"><span>🧠</span></div>
      <p class="lead">בואו נבדוק כמה טוב אתם מכירים מילים!<br>קראו כל שאלה ובחרו את המילה המתאימה.<br>על כל תשובה נכונה – כוכב ⭐</p>
      <button class="btn" style="--c:var(--c2)" id="go">יאללה, מתחילים!</button>
      <details class="about">
        <summary>על המשחק – ידע סמנטי</summary>
        <p><b>מהו ידע סמנטי?</b> הוא הידע שיש לילד על פירוש או מובן של המילה. הוא כולל את אוצר המילים של הילד, המאורגן בקטגוריות וברשת אסוציאטיבית.</p>
        <p>רכישת המילים מתפתחת ותלויה בחשיפה חוזרת למילים בהקשרים שונים.</p>
        <p>לידע סמנטי יש תפקיד חשוב מאוד בתהליך הקריאה: אוצר מילים עשיר מאפשר לקורא להבין את פירוש המילה ואת תוכן הטקסט.</p>
        <p>לידע סמנטי יש תפקיד גם בכתיבה: התלמיד יכול להביע את רעיונותיו ומחשבותיו כאשר הוא בוחר מילים מתאימות ומשתמש בהן נכון.</p>
        <p><b>במשחק מתרגלים:</b> שיוך לקטגוריה, הפכים, זיהוי יוצא דופן וקישור מילה לתמונה.</p>
      </details>
    </div>`;
  document.getElementById('go').onclick = () => { tone('start'); starsEl.style.visibility = 'visible'; showQuestion(); };
}

function showQuestion() {
  const q = QUESTIONS[idx];
  triedThis = false;
  renderStars();
  const opts = shuffle(q.options);
  app.innerHTML = `
    <div class="card" style="--c:${q.color}">
      <div class="badge">${idx + 1}</div>
      <div class="q">${q.q}</div>
      ${q.hint ? `<div class="hint-pic"><span>${q.hint}</span></div>` : ''}
      <div class="options">
        ${opts.map((o, i) => `
          <button class="opt" data-i="${i}">
            <span class="pic">${o.pic}</span>
            <span class="word">${o.word}</span>
            <span class="dot"></span>
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  const fb = document.getElementById('fb');
  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const o = opts[+btn.dataset.i];
      if (o.correct) {
        if (!triedThis) firstTry++;
        btn.classList.add('right');
        app.querySelectorAll('.opt').forEach(b => b.disabled = true);
        fb.className = 'feedback good';
        fb.innerHTML = `${pick(PRAISE)}<small>${q.why}</small>`;
        tone('good');
        burst();
        idx++;
        renderStars();
        setTimeout(() => {
          fb.insertAdjacentHTML('beforeend',
            `<div style="margin-top:12px"><button class="btn" style="--c:${q.color}" id="next">${idx < QUESTIONS.length ? 'לשאלה הבאה ←' : 'סיום 🏁'}</button></div>`);
          document.getElementById('next').onclick = () => idx < QUESTIONS.length ? showQuestion() : endScreen();
        }, 500);
      } else {
        triedThis = true;
        btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
        btn.disabled = true;
        fb.className = 'feedback bad';
        fb.textContent = pick(RETRY);
        tone('bad');
      }
    };
  });
}

function endScreen() {
  renderStars();
  const all = firstTry === QUESTIONS.length;
  app.innerHTML = `
    <div class="screen">
      <div class="big-emoji"><span>${all ? '🏆' : '👍'}</span></div>
      <h2 style="font-size:32px;margin:0">${all ? 'מושלם!' : 'כל הכבוד!'}</h2>
      <p class="score">אספתם ${QUESTIONS.length} כוכבים ⭐<br><span style="font-size:18px;color:var(--muted)">${firstTry} מתוך ${QUESTIONS.length} נכון כבר בניסיון הראשון</span></p>
      <button class="btn" style="--c:var(--c3)" id="again">🔄 שחקו שוב</button>
    </div>`;
  tone('win');
  bigBurst();
  document.getElementById('again').onclick = startScreen;
}

/* ---------- Sound (Web Audio, no files) ---------- */
let actx;
function tone(kind) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seqs = {
      good: [[523, .0], [659, .1], [784, .2]],
      bad: [[300, 0], [220, .15]],
      start: [[440, 0], [660, .1]],
      win: [[523, 0], [659, .12], [784, .24], [1047, .36]],
    };
    seqs[kind].forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine';
      o.frequency.value = f;
      const s = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s + 0.3);
    });
  } catch (e) {}
}
document.getElementById('mute').onclick = e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
};

/* ---------- Confetti ---------- */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], raf = null;
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', resize); resize();
const COLORS = ['#ffd43b', '#2e8b3e', '#2b8fd6', '#8b4fc4', '#f08c1a', '#e5484d'];
function burst(n = 60, x = innerWidth / 2, y = innerHeight / 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: pick(COLORS), life: 90 });
  }
  if (!raf) loop();
}
function bigBurst() { [0, 250, 500].forEach((t, i) => setTimeout(() => burst(80, innerWidth * (0.25 + i * 0.25), innerHeight * 0.35), t)); }
function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1, p.life / 30);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(loop) : null;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

startScreen();
</script>
</body>
</html>
